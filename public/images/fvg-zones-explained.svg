<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="450" y="30" font-size="22" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    FVG (Fair Value Gap) - Price Inefficiency Zones
  </text>

  <!-- Grid -->
  <defs>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e0e0e0" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect x="60" y="60" width="800" height="350" fill="url(#grid2)" stroke="#ccc" stroke-width="1"/>

  <!-- Y-axis -->
  <line x1="60" y1="60" x2="60" y2="410" stroke="#333" stroke-width="2"/>
  <!-- X-axis -->
  <line x1="60" y1="410" x2="860" y2="410" stroke="#333" stroke-width="2"/>

  <!-- Price labels -->
  <text x="30" y="75" font-size="12" fill="#666" text-anchor="end">1.1050</text>
  <text x="30" y="155" font-size="12" fill="#666" text-anchor="end">1.1000</text>
  <text x="30" y="235" font-size="12" fill="#666" text-anchor="end">1.0950</text>
  <text x="30" y="315" font-size="12" fill="#666" text-anchor="end">1.0900</text>
  <text x="30" y="395" font-size="12" fill="#666" text-anchor="end">1.0850</text>

  <!-- Candle 1 (Open move) -->
  <g id="candle-1">
    <!-- Wick -->
    <line x1="150" y1="150" x2="150" y2="250" stroke="#333" stroke-width="1"/>
    <!-- Body -->
    <rect x="120" y="180" width="60" height="50" fill="#4caf50" stroke="#2e7d32" stroke-width="2"/>
    <text x="150" y="440" font-size="11" text-anchor="middle" fill="#333">Candle 1</text>
    <text x="150" y="455" font-size="10" text-anchor="middle" fill="#666">Close: 1.0950</text>
  </g>

  <!-- Candle 2 (Fast move up) -->
  <g id="candle-2">
    <!-- Wick -->
    <line x1="280" y1="80" x2="280" y2="200" stroke="#333" stroke-width="1"/>
    <!-- Strong body (displacement) -->
    <rect x="250" y="100" width="60" height="100" fill="#4caf50" stroke="#2e7d32" stroke-width="2"/>
    <text x="280" y="440" font-size="11" text-anchor="middle" fill="#333">Candle 2</text>
    <text x="280" y="455" font-size="10" text-anchor="middle" fill="#666">(Displacement)</text>
  </g>

  <!-- Candle 3 (Creates gap) -->
  <g id="candle-3">
    <!-- Wick -->
    <line x1="410" y1="60" x2="410" y2="180" stroke="#333" stroke-width="1"/>
    <!-- Body -->
    <rect x="380" y="80" width="60" height="80" fill="#4caf50" stroke="#2e7d32" stroke-width="2"/>
    <text x="410" y="440" font-size="11" text-anchor="middle" fill="#333">Candle 3</text>
    <text x="410" y="455" font-size="10" text-anchor="middle" fill="#666">Open: 1.1020</text>
  </g>

  <!-- FVG ZONE - The inefficiency -->
  <g id="fvg-zone">
    <!-- Highlight the gap -->
    <rect x="180" y="160" width="70" height="60" fill="#ffeb3b" opacity="0.3" stroke="#ff9800" stroke-width="2" stroke-dasharray="5,5"/>

    <!-- Arrows showing the gap -->
    <path d="M 190 165 L 190 175" stroke="#ff9800" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 240 225 L 240 215" stroke="#ff9800" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

    <!-- Labels -->
    <text x="160" y="195" font-size="13" font-weight="bold" fill="#ff9800">FVG</text>
    <text x="160" y="212" font-size="10" fill="#ff6f00">Gap Zone</text>
  </g>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#ff9800"/>
    </marker>
  </defs>

  <!-- Price returning (price action) -->
  <g id="retracement">
    <!-- Price pulls back -->
    <polyline points="410,90 500,180 550,150 600,200"
              stroke="#2196f3" stroke-width="3" fill="none" stroke-linejoin="round"/>

    <!-- Annotations -->
    <circle cx="500" cy="180" r="4" fill="#2196f3"/>
    <text x="500" y="200" font-size="11" text-anchor="middle" fill="#2196f3" font-weight="bold">Price returns</text>
    <text x="500" y="215" font-size="10" text-anchor="middle" fill="#2196f3">to fill FVG!</text>
  </g>

  <!-- Information boxes -->
  <g id="info-boxes">
    <!-- What is FVG -->
    <rect x="70" y="430" width="280" height="55" fill="#f0f4ff" stroke="#2196f3" stroke-width="1" rx="4"/>
    <text x="210" y="450" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">What is FVG?</text>
    <text x="75" y="468" font-size="10" fill="#333">Price inefficiency from fast displacement.</text>
    <text x="75" y="480" font-size="10" fill="#333">Price returns to "rebalance" the gap.</text>

    <!-- Why trade FVG -->
    <rect x="370" y="430" width="280" height="55" fill="#f0fff4" stroke="#4caf50" stroke-width="1" rx="4"/>
    <text x="510" y="450" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Why Trade FVG?</text>
    <text x="375" y="468" font-size="10" fill="#333">High probability retracement zone. Acts</text>
    <text x="375" y="480" font-size="10" fill="#333">like "magnet" for price action precision.</text>

    <!-- How to find -->
    <rect x="670" y="430" width="160" height="55" fill="#fff3e0" stroke="#ff9800" stroke-width="1" rx="4"/>
    <text x="750" y="450" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Criteria:</text>
    <text x="675" y="468" font-size="9" fill="#333">✓ Candle 1 High &lt;</text>
    <text x="675" y="478" font-size="9" fill="#333">  Candle 3 Low</text>
    <text x="675" y="488" font-size="9" fill="#333">✓ Displacement</text>
  </g>

  <!-- Bottom note -->
  <text x="450" y="495" font-size="11" text-anchor="middle" fill="#666" font-style="italic">
    FVG Entry Strategy: Wait for price to enter gap zone, then confirm with bullish candle structure
  </text>
</svg>

