<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="400" y="25" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Market Structure: Bullish Uptrend
  </text>

  <!-- Grid -->
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#e0e0e0" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="800" height="400" fill="url(#grid)" />

  <!-- Y-axis labels -->
  <text x="15" y="385" font-size="12" fill="#666">1.0800</text>
  <text x="15" y="285" font-size="12" fill="#666">1.0850</text>
  <text x="15" y="185" font-size="12" fill="#666">1.0900</text>
  <text x="15" y="85" font-size="12" fill="#666">1.0950</text>

  <!-- Y-axis -->
  <line x1="40" y1="50" x2="40" y2="380" stroke="#333" stroke-width="2"/>
  <!-- X-axis -->
  <line x1="40" y1="380" x2="780" y2="380" stroke="#333" stroke-width="2"/>

  <!-- X-axis labels -->
  <text x="80" y="400" font-size="11" fill="#666">T1</text>
  <text x="180" y="400" font-size="11" fill="#666">T2</text>
  <text x="280" y="400" font-size="11" fill="#666">T3</text>
  <text x="380" y="400" font-size="11" fill="#666">T4</text>
  <text x="480" y="400" font-size="11" fill="#666">T5</text>
  <text x="580" y="400" font-size="11" fill="#666">T6</text>
  <text x="680" y="400" font-size="11" fill="#666">T7</text>

  <!-- Candles -->
  <!-- T1: First Swing Low -->
  <g id="candle-t1">
    <line x1="80" y1="260" x2="80" y2="310" stroke="#ff5252" stroke-width="1"/> <!-- wick -->
    <rect x="65" y="290" width="30" height="40" fill="#ff5252" stroke="#ff5252" stroke-width="1"/> <!-- body open > close (red) -->
    <text x="80" y="340" font-size="10" fill="#666">Low 1</text>
  </g>

  <!-- T2: Moving up -->
  <g id="candle-t2">
    <line x1="180" y1="220" x2="180" y2="290" stroke="#4caf50" stroke-width="1"/>
    <rect x="165" y="240" width="30" height="50" fill="#4caf50" stroke="#4caf50" stroke-width="1"/>
    <text x="180" y="340" font-size="10" fill="#666">Up</text>
  </g>

  <!-- T3: Higher High (Swing High 1) -->
  <g id="candle-t3">
    <line x1="280" y1="140" x2="280" y2="220" stroke="#4caf50" stroke-width="1"/>
    <rect x="265" y="160" width="30" height="60" fill="#4caf50" stroke="#4caf50" stroke-width="1"/>
    <text x="280" y="340" font-size="10" fill="#666" font-weight="bold">HH</text>
    <!-- Label point -->
    <circle cx="280" cy="140" r="3" fill="#1a1a1a"/>
  </g>

  <!-- T4: Pullback (Swing Low 2) -->
  <g id="candle-t4">
    <line x1="380" y1="240" x2="380" y2="310" stroke="#ff5252" stroke-width="1"/>
    <rect x="365" y="270" width="30" height="40" fill="#ff5252" stroke="#ff5252" stroke-width="1"/>
    <text x="380" y="340" font-size="10" fill="#666">LL</text>
    <!-- BUT this LL is still HIGHER than first low -->
  </g>

  <!-- T5: Even higher (Swing High 2) -->
  <g id="candle-t5">
    <line x1="480" y1="100" x2="480" y2="200" stroke="#4caf50" stroke-width="1"/>
    <rect x="465" y="130" width="30" height="70" fill="#4caf50" stroke="#4caf50" stroke-width="1"/>
    <text x="480" y="340" font-size="10" fill="#666" font-weight="bold">HH</text>
    <circle cx="480" cy="100" r="3" fill="#1a1a1a"/>
  </g>

  <!-- T6: Small pullback -->
  <g id="candle-t6">
    <line x1="580" y1="220" x2="580" y2="290" stroke="#ff5252" stroke-width="1"/>
    <rect x="565" y="250" width="30" height="40" fill="#ff8a80" stroke="#ff5252" stroke-width="1"/>
    <text x="580" y="340" font-size="10" fill="#666">HL</text>
    <!-- HL = Higher Low than T4 -->
  </g>

  <!-- T7: Continuing up -->
  <g id="candle-t7">
    <line x1="680" y1="110" x2="680" y2="210" stroke="#4caf50" stroke-width="1"/>
    <rect x="665" y="140" width="30" height="70" fill="#4caf50" stroke="#4caf50" stroke-width="1"/>
    <text x="680" y="340" font-size="10" fill="#666">HH</text>
  </g>

  <!-- Trend lines -->
  <!-- Higher Highs line -->
  <line x1="280" y1="140" x2="480" y2="100" stroke="#4caf50" stroke-width="2" stroke-dasharray="5,5" opacity="0.6"/>
  <!-- Higher Lows line -->
  <line x1="80" y1="310" x2="580" y2="290" stroke="#4caf50" stroke-width="2" stroke-dasharray="5,5" opacity="0.6"/>

  <!-- Legend -->
  <g id="legend" transform="translate(50, 50)">
    <rect x="650" y="0" width="130" height="90" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="665" y="18" font-size="12" font-weight="bold" fill="#333">Uptrend Rules:</text>
    <text x="665" y="35" font-size="11" fill="#333">✓ HH &gt; Previous HH</text>
    <text x="665" y="50" font-size="11" fill="#333">✓ HL &gt; Previous LL</text>
    <text x="665" y="65" font-size="11" fill="#333">✓ Green candles dominant</text>
    <text x="665" y="80" font-size="11" fill="#333">🎯 Buyers in control</text>
  </g>

  <!-- Annotation -->
  <g id="annotation">
    <text x="400" y="370" font-size="11" text-anchor="middle" fill="#666" font-style="italic">
      Structure: Each new high is higher, each new low is higher = STRONG UPTREND
    </text>
  </g>
</svg>

