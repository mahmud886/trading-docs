<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="500" y="35" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    24-Hour Forex Session Trading Volume & Opportunity
  </text>

  <!-- Define gradient for volume bars -->
  <defs>
    <linearGradient id="gradVolume1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#81c784;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2e7d32;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradVolume2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffeb3b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff9800;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradVolume3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff7043;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d84315;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradVolume4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#42a5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1565c0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Grid lines -->
  <line x1="50" y1="100" x2="950" y2="100" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="50" y1="150" x2="950" y2="150" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="50" y1="200" x2="950" y2="200" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="50" y1="250" x2="950" y2="250" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="50" y1="300" x2="950" y2="300" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Axes -->
  <line x1="50" y1="350" x2="950" y2="350" stroke="#333" stroke-width="2"/> <!-- X-axis -->
  <line x1="50" y1="100" x2="50" y2="350" stroke="#333" stroke-width="2"/> <!-- Y-axis -->

  <!-- Y-axis labels (Volume) -->
  <text x="40" y="355" font-size="11" fill="#666" text-anchor="end">Low</text>
  <text x="40" y="255" font-size="11" fill="#666" text-anchor="end">Medium</text>
  <text x="40" y="105" font-size="11" fill="#666" text-anchor="end">High</text>

  <!-- SYDNEY SESSION (04:00-12:00 BD) -->
  <g id="sydney">
    <rect x="70" y="300" width="35" height="50" fill="url(#gradVolume1)"/>
    <text x="87" y="365" font-size="10" text-anchor="middle" fill="#333" font-weight="bold">Sydney</text>
    <text x="87" y="380" font-size="9" text-anchor="middle" fill="#666">4:00-12:00</text>
  </g>

  <!-- TOKYO SESSION (06:00-14:00 BD) -->
  <g id="tokyo">
    <rect x="120" y="220" width="35" height="130" fill="url(#gradVolume1)"/>
    <text x="137" y="365" font-size="10" text-anchor="middle" fill="#333" font-weight="bold">Tokyo</text>
    <text x="137" y="380" font-size="9" text-anchor="middle" fill="#666">6:00-14:00</text>
    <circle cx="137" cy="115" r="4" fill="#2e7d32" stroke="#fff" stroke-width="1"/>
    <text x="137" y="100" font-size="9" text-anchor="middle" fill="#2e7d32">Good</text>
  </g>

  <!-- LONDON SESSION (12:00-20:00 BD) - MAIN SESSION -->
  <g id="london">
    <!-- Main bar -->
    <rect x="170" y="50" width="35" height="300" fill="url(#gradVolume2)"/>
    <text x="187" y="365" font-size="10" text-anchor="middle" fill="#333" font-weight="bold">London</text>
    <text x="187" y="380" font-size="9" text-anchor="middle" fill="#666">12:00-20:00</text>
    <circle cx="187" cy="25" r="5" fill="#ff9800" stroke="#fff" stroke-width="2"/>
    <text x="187" y="10" font-size="11" text-anchor="middle" fill="#ff9800" font-weight="bold">★ BEST</text>
  </g>

  <!-- LONDON-NY OVERLAP (20:00-00:00 BD) - SUPER SESSION -->
  <g id="ln-overlap">
    <!-- Super bar -->
    <rect x="220" y="20" width="35" height="330" fill="url(#gradVolume3)"/>
    <text x="237" y="365" font-size="10" text-anchor="middle" fill="#333" font-weight="bold">L-NY</text>
    <text x="237" y="380" font-size="9" text-anchor="middle" fill="#666">20:00-00:00</text>
    <circle cx="237" cy="10" r="6" fill="#d84315" stroke="#fff" stroke-width="2"/>
    <text x="237" y="-5" font-size="12" text-anchor="middle" fill="#d84315" font-weight="bold">★★ PEAK!</text>
  </g>

  <!-- NEW YORK SESSION (20:00-04:00 BD) -->
  <g id="ny">
    <rect x="270" y="80" width="35" height="270" fill="url(#gradVolume4)"/>
    <text x="287" y="365" font-size="10" text-anchor="middle" fill="#333" font-weight="bold">NY</text>
    <text x="287" y="380" font-size="9" text-anchor="middle" fill="#666">20:00-4:00</text>
    <circle cx="287" cy="45" r="4" fill="#1565c0" stroke="#fff" stroke-width="1"/>
    <text x="287" y="30" font-size="9" text-anchor="middle" fill="#1565c0">Volatile</text>
  </g>

  <!-- CONTINUATION -->
  <g id="continuation">
    <!-- After NY -->
    <rect x="320" y="200" width="35" height="150" fill="#ccc"/>
    <text x="337" y="365" font-size="10" text-anchor="middle" fill="#333">Late</text>
    <text x="337" y="380" font-size="9" text-anchor="middle" fill="#666">NY Close</text>

    <!-- Back to Sydney -->
    <rect x="370" y="280" width="80" height="70" fill="url(#gradVolume1)" opacity="0.6"/>
    <text x="410" y="365" font-size="10" text-anchor="middle" fill="#333">Sydney 2</text>
    <text x="410" y="380" font-size="9" text-anchor="middle" fill="#666">cycles</text>
  </g>

  <!-- INFO SECTION -->
  <g id="info-section" transform="translate(0, 400)">
    <!-- Session Details Box 1 -->
    <rect x="50" y="20" width="170" height="150" fill="#e8f5e9" stroke="#4caf50" stroke-width="1" rx="4"/>
    <text x="135" y="40" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Sydney</text>
    <text x="60" y="60" font-size="9" fill="#333">• Lowest volume</text>
    <text x="60" y="75" font-size="9" fill="#333">• Small moves (&lt;50p)</text>
    <text x="60" y="90" font-size="9" fill="#333">• Wide spreads</text>
    <text x="60" y="105" font-size="9" fill="#333">• AUD pairs active</text>
    <text x="60" y="120" font-size="9" fill="#333">• Best: Swing trades</text>
    <text x="60" y="135" font-size="9" fill="#333">• Avoid: Scalping</text>
    <text x="60" y="150" font-size="9" fill="#333">• Danger: Thin market</text>

    <!-- Session Details Box 2 -->
    <rect x="240" y="20" width="170" height="150" fill="#fff3e0" stroke="#ff9800" stroke-width="1" rx="4"/>
    <text x="325" y="40" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">London</text>
    <text x="250" y="60" font-size="9" fill="#333">• ★ Highest volume</text>
    <text x="250" y="75" font-size="9" fill="#333">• Big moves (+100p)</text>
    <text x="250" y="90" font-size="9" fill="#333">• Tight spreads</text>
    <text x="250" y="105" font-size="9" fill="#333">• EUR/USD dominate</text>
    <text x="250" y="120" font-size="9" fill="#333">• Best: 12-14:00 BD</text>
    <text x="250" y="135" font-size="9" fill="#333">• News heavy</text>
    <text x="250" y="150" font-size="9" fill="#333">• Best strategy hour</text>

    <!-- Session Details Box 3 -->
    <rect x="430" y="20" width="170" height="150" fill="#fee" stroke="#d84315" stroke-width="2" rx="4"/>
    <text x="515" y="40" font-size="11" font-weight="bold" text-anchor="middle" fill="#d84315">L-NY Overlap</text>
    <text x="440" y="60" font-size="9" fill="#333">• ★★ PEAK VOLUME</text>
    <text x="440" y="75" font-size="9" fill="#333">• Biggest pips (150+)</text>
    <text x="440" y="90" font-size="9" fill="#333">• Best liquidity ever</text>
    <text x="440" y="105" font-size="9" fill="#333">• Fast execution</text>
    <text x="440" y="120" font-size="9" fill="#933">• Best: 20:00-21:30</text>
    <text x="440" y="135" font-size="9" fill="#933">• Ideal: Breakouts</text>
    <text x="440" y="150" font-size="9" fill="#933">• Max opportunity</text>

    <!-- Session Details Box 4 -->
    <rect x="620" y="20" width="170" height="150" fill="#e3f2fd" stroke="#1565c0" stroke-width="1" rx="4"/>
    <text x="705" y="40" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">New York</text>
    <text x="630" y="60" font-size="9" fill="#333">• 2nd highest volume</text>
    <text x="630" y="75" font-size="9" fill="#333">• Very volatile (+120p)</text>
    <text x="630" y="90" font-size="9" fill="#333">• US data releases</text>
    <text x="630" y="105" font-size="9" fill="#333">• USDCAD strong</text>
    <text x="630" y="120" font-size="9" fill="#333">• Risk: High</text>
    <text x="630" y="135" font-size="9" fill="#333">• Reward: Very high</text>
    <text x="630" y="150" font-size="9" fill="#333">• Expert traders only</text>

    <!-- Bottom recommendation -->
    <rect x="50" y="180" width="740" height="60" fill="#fffbee" stroke="#ff6f00" stroke-width="2" rx="4"/>
    <text x="420" y="202" font-size="12" font-weight="bold" text-anchor="middle" fill="#d84315">
      🎯 TRADER'S SWEET SPOT: 20:00-21:30 BD (London-New York Overlap)
    </text>
    <text x="420" y="223" font-size="10" text-anchor="middle" fill="#333">
      This is when the MOST professional traders are active. Maximum opportunity. Tightest spreads. Best risk/reward.
    </text>
  </g>
</svg>

